spring:
  application:
    name: mini-core-banking

  datasource:
    url: jdbc:postgresql://localhost:5432/postgres?currentSchema=core
    username: postgres
    password: 123456
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        default_schema: core

logging:
  level:
    com:
      zaxxer:
        hikari=DEBUG:

